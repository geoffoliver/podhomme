spec:
  name: podhomme
  services:
    - name: web
      image:
        registry_type: GHCR
        registry: geoffoliver
        repository: podhomme
        tag: latest
      instance_size_slug: apps-s-1vcpu-1gb
      instance_count: 1
      http_port: 3030
      routes:
        - path: /
      envs:
        - key: DATABASE_URL
          value: file:/workspace/data/podhomme.db
          scope: RUN_AND_BUILD_TIME
        - key: NODE_ENV
          value: production
          scope: RUN_TIME
        - key: APP_PASSWORD
          value: ""
          scope: RUN_TIME
        - key: WORKER_SECRET
          value: ""
          scope: RUN_TIME
        - key: WEB_URL
          value: ${APP_URL}
          scope: RUN_TIME
